# =============================================================================
# docker-compose.yml: runs the WHOLE app on one server
# -----------------------------------------------------------------------------
# Docker Compose reads this file and creates/starts several containers together
# (a "stack"), wired up on private networks.
#
#                 internet
#                    |
#               port 80 (only published port)
#                    |
#            +-------v-------+
#            |  web (nginx)  |  serves the React site, forwards /api/ to backend
#            +-------+-------+
#                    |   network "web-net"
#            +-------v-------+
#            |    backend    |  Spring Boot API (not reachable from outside)
#            +-------+-------+
#
#
# FIRST-TIME SETUP (details in DOCKER.md):
#   1. copy .env.example to .env and fill in the passwords and JWT_SECRET
#   3. docker compose up -d --build
#   4. open http://localhost
#
# DAILY COMMANDS:
#   docker compose up -d --build   build images if needed and start everything
#   docker compose ps              show what is running and healthy
#   docker compose logs -f backend follow one service's logs (Ctrl+C to stop)
#   docker compose down            stop and remove containers (data is KEPT)
#   docker compose down -v         ALSO delete the database volume (DATA LOST)
# =============================================================================

# Project name. Used as a prefix for the containers, networks and volumes
# Compose creates (for example "isaiah118_db-data").
name: isaiah118

# fill a server's disk. This keeps at most 3 files of 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # BACKEND (Spring Boot API)
  backend:
    build:
      context: ./backend/backend
    image: isaiah118-backend
    restart: unless-stopped

    environment:
      SERVER_PORT: "8080"
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ORIGINS: ${SITE_URL:-http://localhost}

    mem_limit: ${BACKEND_MEM_LIMIT:-768m}

    networks:
      - web-net
    logging: *default-logging


  # ---------------------------------------------------------------------------
  # WEB (nginx: React site + reverse proxy)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
    image: isaiah118-web
    restart: unless-stopped

    # Start after the backend container exists. (nginx re-resolves the backend's
    # address on every request, so it also copes with the backend restarting.)
    depends_on:
      - backend

    # "HOST:CONTAINER". This is the ONLY port opened on the server. The host
    # side defaults to 80; set HTTP_PORT in .env to use another one (for
    # example 8080 if port 80 is taken). For HTTPS you would also add "443:443"
    # (see DOCKER.md).
    ports:
      - "${HTTP_PORT:-80}:80"

    networks:
      - web-net
    logging: *default-logging

# Private virtual networks. Containers on the same network can reach each other
# by service name; containers on different networks cannot.
networks:
  web-net: