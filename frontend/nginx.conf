# =============================================================================
# nginx site configuration (copied to /etc/nginx/conf.d/default.conf)
# -----------------------------------------------------------------------------
# nginx plays two roles here:
#   1. WEB SERVER: hands out the built React files (index.html, JS, CSS, fonts).
#   2. REVERSE PROXY: forwards every URL starting with /api/ to the Spring Boot
#      container. The browser never talks to the backend directly.
#
#   browser --> nginx (port 80) --+--> /api/...  --> backend:8080 (Spring Boot)
#                                 +--> anything else --> static files
#
# Because the page and the API share one address (same "origin"), browsers do
# not apply CORS rules, and the frontend needs no server address in its code.
# =============================================================================

# One shared memory zone, keyed by client IP, allowing 10 requests per second.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

server {
    # Listen on port 80 (HTTP) inside the container.
    listen 80;

    # "_" is a catch-all name, so this server answers for any domain or IP.
    server_name _;

    # Do not advertise the exact nginx version in responses and error pages.
    server_tokens off;

    # Folder the React build was copied into (see frontend/Dockerfile).
    root /usr/share/nginx/html;
    index index.html;

    # The largest request body accepted. This API only receives small JSON.
    client_max_body_size 1m;

    # Basic browser hardening headers.
    #   nosniff    - do not guess file types
    #   SAMEORIGIN - other sites cannot put this site in an <iframe>
    # "always" adds them to error responses too.
    # CAUTION: if a nested "location" block uses add_header, nginx stops
    # inheriting these. That is why caching below uses "expires" instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text responses before sending (much smaller JS/CSS/JSON).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/ttf font/otf;

    # ---- 1) API: forward to the backend container ---------------------------
    location /api/ {
        # 127.0.0.11 is Docker's built-in DNS server. It turns the service name
        # "backend" into the container's current IP. "valid=10s" re-checks every
        # 10 seconds.
        resolver 127.0.0.11 valid=10s ipv6=off;

        limit_req zone=api_per_ip burst=40 nodelay;   # allow short bursts of 40 extra requests
        limit_req_status 429;                         # same status code as the Spring filter

        # Putting the address in a VARIABLE makes nginx look it up on each
        # request instead of once at startup. Result: nginx still starts if the
        # backend is not up yet, and it follows the backend if its IP changes
        # after a restart. (With a literal address, nginx would refuse to start
        # with "host not found in upstream".)
        # "backend" = service name in docker-compose.yml; 8080 = SERVER_PORT.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;

        # Pass along who the real client was and what the original request was.
        # Without these the backend would see every request coming from nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Give up quickly if the backend is down; allow slow queries up to 60s.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ---- 2) Static files ----------------------------------------------------

    # Vite names built files with a content hash (index-MhFES5s0.js). A changed
    # file gets a new name, so old names can be cached for a year. If a file is
    # missing, return a real 404 (not index.html).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Font files from frontend/public/fonts. A missing font must be a 404. The
    # catch-all below would otherwise answer with index.html (an HTML page where
    # the browser expects a font).
    location /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    # Tiny endpoint for the Docker HEALTHCHECK. No access log, so it does not
    # fill the logs every 30 seconds.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 3) Single-page-app fallback ----------------------------------------
    # React Router handles URLs like /kjv/1/1/1 in the browser. There is no such
    # FILE on disk, so for any path that is not a real file, return index.html
    # and let React take over. Without this, refreshing the page on /kjv/1/1/1
    # would give a 404.
    # "expires -1" = "Cache-Control: no-cache": browsers re-check index.html on
    # every visit, so a new deploy is picked up immediately (the hashed files it
    # points to are cached long-term above).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# HTTPS (not enabled here)
# -----------------------------------------------------------------------------
# This config serves plain HTTP. Anything public needs HTTPS, because login
# passwords and JWT tokens would otherwise cross the internet readable. See
# DOCKER.md, section "HTTPS", for the options.
# =============================================================================
